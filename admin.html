<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEXOVA Admin Panel</title>
  <link rel="icon" href="https://i.ibb.co/3ykXWjG/nexova-logo.jpg">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <img src="https://i.ibb.co/3ykXWjG/nexova-logo.jpg" alt="NEXOVA Logo">
    <span>NEXOVA ADMIN</span>
    <h1>Control Center</h1>
    <p>Private store management</p>
    <input id="uid" placeholder="User ID" value="Nexova">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Enter Dashboard</button>
  </div>
</div>

<div id="dashboard" class="hidden">
  <aside>
    <div class="admin-brand"><img src="https://i.ibb.co/3ykXWjG/nexova-logo.jpg"><b>NEXOVA</b></div>
    <button class="active">⌂ Overview</button>
    <a href="index.html">↗ View Store</a>
  </aside>
  
  <main>
    <header>
      <div><span>ADMIN CONTROL CENTER</span><h2>Overview</h2></div>
      <div class="admin-user">NEXOVA <b>ADMIN</b></div>
    </header>
    
    <section class="tab-page active">
      <div class="stats">
        <div><span>Total Products</span><b id="statProducts">0</b></div>
      </div>
      
      <div class="panel">
        <div class="toolbar">
          <h3>Products Control</h3>
          <button onclick="openEditor()" class="gold">＋ Add Product</button>
        </div>
        <div class="admin-grid" id="adminProducts"></div>
      </div>
    </section>
  </main>
</div>

<div class="editor modal" id="editor">
  <div class="editor-card">
    <button class="close" onclick="closeEditor()">×</button>
    <h2 id="editorTitle">Add Product</h2>
    <input type="hidden" id="pid">
    
    <label>Product Name <input id="pname"></label>
    <div class="two">
      <label>Price (৳) <input id="pprice" type="number"></label>
      <label>Previous Price (৳) <input id="pold" type="number"></label>
    </div>
    
    <label>Category
      <select id="pcat">
        <option>perfumes</option>
        <option>gadgets</option>
        <option>watch</option>
        <option>sunglass</option>
        <option>phone-accessories</option>
        <option>gift-box</option>
        <option>shirt</option>
        <option>pant</option>
        <option>t-shirt</option>
        <option>beauty</option>
      </select>
    </label>
    
    <label>Colors / Variants (কমা দিয়ে লিখুন, যেমন: Red, Black, Gold) 
      <input id="pcolors" placeholder="Red, Black, Gold">
    </label>
    
    <label>Tags (যেমন: hot, men, discount) 
      <input id="ptags" placeholder="hot,men,discount">
    </label>
    
    <label>Description <textarea id="pdesc" rows="3"></textarea></label>
    <label>Image URL (ছবি লিংক) <input id="pimage" placeholder="অনলাইন ছবির লিংক"></label>
    
    <button class="gold" onclick="saveProduct()" style="margin-top:15px;">Save Product</button>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
